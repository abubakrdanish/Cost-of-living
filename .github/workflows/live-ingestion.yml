# Manual only: downloads real ABS data (4 polite requests), runs the full
# pipeline flow (freshness + dbt build with production settings + report), and
# checks the committed CI fixtures still match the real file layout.
# Never runs automatically.
name: Live ingestion check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PREFECT_SERVER_ANALYTICS_ENABLED: "false"

jobs:
  live:
    name: Live ABS download + full flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run the pipeline flow (downloads, freshness, dbt build, report)
        run: |
          cp dbt_project/profiles.yml.example dbt_project/profiles.yml
          python -m orchestration.flow

      - name: Check CI fixtures match the real ABS file layout
        if: always()
        run: python -m ingestion.ci_fixtures check

      - name: Upload quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-quality-report
          path: |
            reports/quality_report.md
            reports/quality_report.json
          if-no-files-found: warn
          retention-days: 30
