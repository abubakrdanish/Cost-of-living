version: 2

# Freshness (approved 2026-10-14) measures how old the newest *data period* is,
# not when we last downloaded it, so it catches both "ingestion stopped" and
# "ABS hasn't published". Age = now - last day of the newest period.
# Thresholds follow the ABS release lags; see docs/operations.md.
#   CPI and rents (monthly, released ~4 weeks after the month):
#     the newest month is normally 31-61 days old (e.g. Aug ends 31 Aug,
#     Sep is released 28 Oct). warn > 65 days = one release missed,
#     error > 95 days = two releases missed.
#   WPI (quarterly, released ~7 weeks after the quarter):
#     normally 49-141 days old (Jun qtr ends 30 Jun, Sep qtr released 18 Nov).
#     warn > 150 days = one release missed, error > 240 days.
#   Archive (final quarterly CPI release): frozen, no freshness check.
# `dbt build` does not run these; the Prefect flow runs `dbt source freshness`.

sources:
  - name: raw
    description: >
      Tables loaded by the Python ingestion (ingestion/load_raw.py). Every
      downloaded snapshot is kept, tagged with _source_file and _loaded_at.
      SDMX-CSV tables store every value as text exactly as downloaded, with
      'code: label' pairs (e.g. '2: Melbourne'). See docs/data_sources.md.
    schema: raw
    tables:
      - name: abs_cpi_all_groups
        description: ABS,CPI,2.0.0 key 1.10001... (All groups CPI index numbers, all regions, M and Q).
        config:
          loaded_at_field: "cast(last_day(strptime(time_period, '%Y-%m')) as timestamp)"
          freshness:
            warn_after: {count: 65, period: day}
            error_after: {count: 95, period: day}
            filter: "freq = 'M: Monthly'"
        columns:
          - name: time_period
            data_tests: [not_null]
          - name: _source_file
            data_tests: [not_null]
      - name: abs_cpi_rents
        description: ABS,CPI,2.0.0 key 1.30014+115522... (CPI Rents index numbers).
        config:
          loaded_at_field: "cast(last_day(strptime(time_period, '%Y-%m')) as timestamp)"
          freshness:
            warn_after: {count: 65, period: day}
            error_after: {count: 95, period: day}
            filter: "freq = 'M: Monthly'"
        columns:
          - name: time_period
            data_tests: [not_null]
          - name: _source_file
            data_tests: [not_null]
      - name: abs_cpi_capital_cities_quarterly_2025q3
        description: >
          6401.0 Sep quarter 2025 (final quarterly CPI release), Table 9, parsed
          to long format: one row per series and quarter. Index base 2011-12 = 100.
          Frozen release, so no freshness check.
        config:
          freshness: null
        columns:
          - name: series_id
            data_tests: [not_null]
          - name: period
            data_tests: [not_null]
      - name: abs_wpi
        description: ABS,WPI,1.2.0 key 1......Q (WPI quarterly index numbers, all breakdowns).
        config:
          # 'YYYY-Qn' -> last day of the quarter
          loaded_at_field: >-
            cast(last_day(make_date(cast(left(time_period, 4) as integer),
            cast(right(time_period, 1) as integer) * 3, 1)) as timestamp)
          freshness:
            warn_after: {count: 150, period: day}
            error_after: {count: 240, period: day}
        columns:
          - name: time_period
            data_tests: [not_null]
          - name: _source_file
            data_tests: [not_null]
